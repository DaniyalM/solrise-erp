# =============================================================================
# Hand-maintained, non-secret settings.
# AWS facts (RDS endpoint, domain, secret ARN, bucket) arrive in terraform.yml,
# generated by `terraform apply`.
# =============================================================================
---

# --- host --------------------------------------------------------------------
deploy_user: ubuntu
app_dir: /opt/solrise-erp
timezone: UTC
swap_size_mb: 4096

# --- source ------------------------------------------------------------------
# Point this at the repository holding THIS project (compose/, scripts/, Makefile).
repo_url: "https://github.com/DaniyalM/solrise-erp.git"
repo_version: main

# --- image -------------------------------------------------------------------
custom_image: docker.io/daniyalbphq/solrise
custom_tag: version-15
frappe_branch: version-15
# The custom app baked in via apps.json (${SOLRISE_APP_URL}).
solrise_app_url: "https://github.com/DaniyalM/solrise_erp"
solrise_app_branch: main
install_apps: "erpnext,hrms"

# Rebuild the image on the EC2 host itself. ECR is the primary source: the image
# is built in GitHub Actions and pulled here, so this defaults to false.
# Set true only for the fallback "build on the host" path (also requires
# ECR to be disabled/empty).
rebuild_image: false

# --- runtime -----------------------------------------------------------------
gunicorn_workers: 2
gunicorn_threads: 4
gunicorn_timeout: 120

# --- site setup --------------------------------------------------------------
# Run create-site.sh (site + apps + setup_erp.py + roles_rbac.py), idempotent.
run_site_setup: true

# --- backups -----------------------------------------------------------------
backup_cron_enabled: true
backup_hour: "2"
backup_minute: "15"
backup_retention_days: 14
# Empty = <app_dir>/backups. Set an absolute path (e.g. on a larger volume) to override.
backup_dir: ""
# Push the file backups to the Terraform-managed S3 bucket (needs awscli).
backup_s3_enabled: false
